<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Químico 3D - 110 Moléculas do Cotidiano</title>

  <!-- Biblioteca 3Dmol.js via CDN -->
  <script src="https://3dmol.org/build/3Dmol-min.js"></script>

  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --bg-card: #2a2a2a;
      --text-primary: #ffffff;
      --text-secondary: #aaa;
      --border-color: #333333;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --panel-overlay: rgba(20, 20, 20, 0.85);
    }

    [data-theme="light"] {
      --bg-primary: #f4f6f8;
      --bg-secondary: #ffffff;
      --bg-card: #eef2f6;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border-color: #e5e7eb;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --panel-overlay: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Painel Lateral */
    .sidebar {
      width: 340px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-primary);
      outline: none;
      font-size: 0.9rem;
    }

    .molecule-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .molecule-item {
      padding: 10px 14px;
      border-radius: 8px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .molecule-item:hover, .molecule-item.active {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .molecule-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .molecule-info p {
      font-size: 0.75rem;
      opacity: 0.8;
    }

    /* Área Principal / Visualizador */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .viewer-container {
      flex: 1;
      position: relative;
      touch-action: none;
    }

    #mol-viewer {
      width: 100%;
      height: 100%;
    }

    /* Manual "Sobre a Substância" (Canto Superior Esquerdo) */
    .info-card {
      position: absolute;
      top: 15px;
      left: 15px;
      max-width: 360px;
      width: calc(100% - 100px);
      background: var(--panel-overlay);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      z-index: 15;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .info-card-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid transparent;
    }

    .info-card-header.open {
      border-bottom-color: var(--border-color);
    }

    .info-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-icon {
      font-size: 0.8rem;
      transition: transform 0.3s ease;
    }

    .toggle-icon.open {
      transform: rotate(180deg);
    }

    .info-card-body {
      padding: 14px 16px;
      display: none;
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .info-card-body.open {
      display: block;
    }

    .meta-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--accent-color);
      color: #fff;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }

    .color-legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .color-legend h5 {
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      background: var(--bg-card);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Botão de Auto-Girar no Canto Superior Direito */
    .top-right-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 15;
    }

    /* Controles Inferiores (Estilo e Reset) */
    .bottom-controls-panel {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: var(--panel-overlay);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      z-index: 10;
      justify-content: center;
    }

    .btn {
      background-color: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .btn.active {
      background-color: var(--accent-color);
      color: #fff;
    }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      z-index: 30;
      display: none;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: 220px; }
      .main-content { height: calc(100vh - 220px); }
      .info-card { max-width: calc(100% - 90px); }
    }
  </style>
</head>
<body data-theme="dark">

  <!-- Painel Lateral -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Catálogo Químico (110)</h2>
      <button class="theme-toggle-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span> <span id="theme-text">Claro</span>
      </button>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Buscar molécula..." oninput="filterMolecules()">
    </div>

    <div class="molecule-list" id="molecule-list">
      <!-- Inserido dinamicamente -->
    </div>

  <!-- Área do Simulador 3D -->
  <div class="main-content">
    <div class="loading-overlay" id="loading">Carregando estrutura 3D...</div>

    <div class="viewer-container">
      <div id="mol-viewer"></div>

      <!-- Manual Abri/Fecha (Superior Esquerdo) -->
      <div class="info-card">
        <div class="info-card-header open" id="info-header" onclick="toggleInfoCard()">
          <div class="info-card-title">
            <span>📖</span> <span id="info-mol-name">Sobre a Substância</span>
          </div>
          <span class="toggle-icon open" id="info-toggle-icon">▲</span>
        </div>
        <div class="info-card-body open" id="info-body">
          <span class="meta-tag" id="info-mol-cat">Categoria</span>
          <p id="info-mol-desc">Selecione uma molécula para ver suas propriedades.</p>

          <div class="color-legend">
            <h5>Legenda de Cores (Padrão CPK):</h5>
            <div class="legend-items" id="legend-items">
              <!-- Inserido dinamicamente -->
            </div>
          </div>
        </div>
      </div>

      <!-- Botão Auto-Girar no Canto Superior Direito -->
      <div class="top-right-controls">
        <button class="btn" id="btn-spin" onclick="toggleSpin()">🔄 Auto-Girar</button>
      </div>

      <!-- Controles de Estilo e Reset na Parte Inferior -->
      <div class="bottom-controls-panel">
        <button class="btn" onclick="toggleStyle()">🎨 Estilo: <span id="style-name">Esferas e Varetas</span></button>
        <button class="btn" onclick="resetCamera()">🎯 Resetar Visão</button>
      </div>
    </div>
  </div>

      { name: "Bilirrubina", cid: 5280352, cat: "Bile / Fígado", desc: "Pigmento amarelo metabólico processado pelo fígado e expelido na bile." },
      { name: "Vitamina A (Retinol)", cid: 445354, cat: "Visão / Imunidade", desc: "Nutriente liposolúvel vital para a saúde ocular e renovação celular." },
      { name: "Vitamina B1 (Tiamina)", cid: 1130, cat: "Energia Metabólica", desc: "Atua na conversão de carboidratos em energia no sistema nervoso." },
      { name: "Vitamina B3 (Niacina)", cid: 938, cat: "Metabolismo Celular", desc: "Essencial no reparo celular e no funcionamento do metabolismo energético." },
      { name: "Vitamina B6 (Piridoxina)", cid: 1054, cat: "Síntese Aminoácidos", desc: "Coenzima essencial para a produção de neurotransmissores e hemácias." },

      { name: "Curcumina", cid: 5551, cat: "Açafrão / Cúrcuma", desc: "Pigmento amarelo da cúrcuma com potente ação anti-inflamatória." },
      { name: "Glutationa", cid: 124886, cat: "Antioxidante Celular", desc: "O principal antioxidante endógeno produzido naturalmente pelo fígado." },

      { name: "Sulfeto de Hidrogênio", cid: 402, cat: "Odor de Ovo Podre", desc: "Gás com forte cheiro característico, presente em esgotos e emissões vulcânicas." },
      { name: "Atropina", cid: 174174, cat: "Dilatador de Pupila", desc: "Medicamento anticolinérgico usado em exames oftalmológicos e emergências." },
      { name: "Escopolamina", cid: 3000322, cat: "Anti-enjoo", desc: "Utilizada para prevenir enjoos em viagens e espasmos abdominais." },
      { name: "Glifosato", cid: 3496, cat: "Herbicida", desc: "O herbicida agrícola mais utilizado no mundo para controle de ervas daninhas." }
    ];

    const cpkColors = {
      "H": { name: "Hidrogênio", color: "#FFFFFF" },
      "C": { name: "Carbono", color: "#909090" },
      "N": { name: "Nitrogênio", color: "#3050F8" },
      "O": { name: "Oxigênio", color: "#FF0D0D" },
      "F": { name: "Flúor", color: "#90E050" },
      "Cl": { name: "Cloro", color: "#1FF01F" },
      "Br": { name: "Bromo", color: "#A62929" },
      "I": { name: "Iodo", color: "#940094" },
      "P": { name: "Fósforo", color: "#FF8000" },
      "S": { name: "Enxofre", color: "#FFFF30" },
      "Na": { name: "Sódio", color: "#AB5CF2" },
      "Ca": { name: "Cálcio", color: "#3DFF00" },
      "Fe": { name: "Ferro", color: "#E06633" }
    };

    let viewer = null;
    let isSpinning = false;
    let currentStyleIndex = 0;
    let selectedCid = null;

    const styles = [
      { name: "Esferas e Varetas", config: { stick: { radius: 0.15 }, sphere: { scale: 0.25 } } },
      { name: "Linhas (Estrutural)", config: { line: { linewidth: 2 } } },
      { name: "Somente Varetas", config: { stick: { radius: 0.25 } } },
      { name: "Esferas Espaciais (vdW)", config: { sphere: { scale: 0.75 } } }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const element = document.getElementById("mol-viewer");
      
      viewer = $3Dmol.createViewer(element, {
        backgroundColor: "black",
        defaultcolors: $3Dmol.elementColors.element
      });

      renderMoleculeList(molecules);
      loadMolecule(molecules[0].cid);
    });

    function renderMoleculeList(list) {
      const container = document.getElementById("molecule-list");
      container.innerHTML = "";

      list.forEach(mol => {
        const item = document.createElement("div");
        item.className = `molecule-item ${mol.cid === selectedCid ? 'active' : ''}`;
        item.onclick = () => loadMolecule(mol.cid);
        item.innerHTML = `
          <div class="molecule-info">
            <h4>${mol.name}</h4>
            <p>${mol.cat}</p>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function filterMolecules() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = molecules.filter(m => 
        m.name.toLowerCase().includes(query) || 
        m.cat.toLowerCase().includes(query) ||
        m.desc.toLowerCase().includes(query)
      );
      renderMoleculeList(filtered);
    }

    async function loadMolecule(cid) {
      selectedCid = cid;
      renderMoleculeList(molecules);

      const molData = molecules.find(m => m.cid === cid);
      if (molData) {
        document.getElementById("info-mol-name").innerText = molData.name;
        document.getElementById("info-mol-cat").innerText = molData.cat;
        document.getElementById("info-mol-desc").innerText = molData.desc;
      }

      document.getElementById("loading").style.display = "flex";

      try {
        const response = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/SDF?record_type=3d`);
        if (!response.ok) throw new Error("Erro ao carregar estrutura 3D");
        
        const sdfData = await response.text();

        viewer.clear();
        const model = viewer.addModel(sdfData, "sdf");
        
        applyCurrentStyle();
        updateColorLegend(model);
        
        viewer.zoomTo(800);
        viewer.render();
      } catch (err) {
        alert("Não foi possível carregar a estrutura 3D desta molécula.");
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function updateColorLegend(model) {
      const atoms = model.selectedAtoms({});
      const elementsFound = new Set();
      
      atoms.forEach(atom => elementsFound.add(atom.elem));

      const legendContainer = document.getElementById("legend-items");
      legendContainer.innerHTML = "";

      elementsFound.forEach(elem => {
        const info = cpkColors[elem] || { name: elem, color: "#CCCCCC" };
        const badge = document.createElement("div");
        badge.className = "legend-badge";
        badge.innerHTML = `
          <div class="color-dot" style="background-color: ${info.color}"></div>
          <span><b>${elem}</b> (${info.name})</span>
        `;
        legendContainer.appendChild(badge);
      });
    }

    function toggleInfoCard() {
      const body = document.getElementById("info-body");
      const icon = document.getElementById("info-toggle-icon");
      const header = document.getElementById("info-header");

      body.classList.toggle("open");
      icon.classList.toggle("open");
      header.classList.toggle("open");
    }

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute("data-theme") === "dark";
      
      const newTheme = isDark ? "light" : "dark";
      body.setAttribute("data-theme", newTheme);

      document.getElementById("theme-icon").innerText = isDark ? "🌙" : "☀️";
      document.getElementById("theme-text").innerText = isDark ? "Escuro" : "Claro";

      if (viewer) {
        viewer.setBackgroundColor(isDark ? "white" : "black");
        viewer.render();
      }
    }

    function toggleSpin() {
      isSpinning = !isSpinning;
      const btn = document.getElementById("btn-spin");
      if (isSpinning) {
        viewer.spin("y", 1);
        btn.classList.add("active");
      } else {
        viewer.spin(false);
        btn.classList.remove("active");
      }
    }

    function toggleStyle() {
      currentStyleIndex = (currentStyleIndex + 1) % styles.length;
      applyCurrentStyle();
    }

    function applyCurrentStyle() {
      const style = styles[currentStyleIndex];
      viewer.setStyle({}, style.config);
      viewer.render();
      document.getElementById("style-name").innerText = style.name;
    }

    function resetCamera() {
      viewer.zoomTo(1000);
    }
  </script>
</body>
</html>
